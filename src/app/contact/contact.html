<section class="contact-hero text-white d-flex align-items-center">
  <div class="container text-center">
    <h1 class="display-4 fw-bold text-light">Let’s Talk</h1>
    <p class="lead">We’d love to help your business grow</p>
  </div>
</section>

<section class="py-5">
  <div class="container">
    <div class="row g-4">

      <!-- LEFT: FORM -->
      <div class="col-md-7">
        <div class="contact-card p-4">

          <h4 class="fw-bold mb-3">Send us a message</h4>

          <form (ngSubmit)="submitForm()" #contactForm="ngForm">

            <div class="row">
              <div class="col-md-6 mb-3">
                <input type="text" class="form-control"
                       placeholder="First Name"
                       [(ngModel)]="form.firstName"
                       name="firstName" required>
              </div>

              <div class="col-md-6 mb-3">
                <input type="text" class="form-control"
                       placeholder="Last Name"
                       [(ngModel)]="form.lastName"
                       name="lastName" required>
              </div>
            </div>

            <div class="mb-3">
              <input type="email" class="form-control"
                     placeholder="Email"
                     [(ngModel)]="form.email"
                     name="email" required>
            </div>

            <div class="mb-3">
              <input type="text" class="form-control"
                     placeholder="Subject"
                     [(ngModel)]="form.subject"
                     name="subject">
            </div>

            <div class="mb-3">
              <textarea class="form-control" rows="4"
                        placeholder="Your Message"
                        [(ngModel)]="form.message"
                        name="message"></textarea>
            </div>

            <button class="btn btn-primary w-100 rounded-pill">
              Send Message
            </button>

          </form>

        </div>
      </div>

      <!-- RIGHT: CONTACT INFO -->
      <div class="col-md-5">
        <div class="contact-info p-4 h-100">

          <h5 class="fw-bold mb-4">Contact Information</h5>

          <p><i class="fas fa-map-marker-alt me-2"></i> Mohali, India</p>
          <p><i class="fas fa-phone me-2"></i> +91 98765 43210</p>
          <p><i class="fas fa-envelope me-2"></i> support@yourcompany.com</p>

          <hr>

          <h6 class="fw-bold">Business Hours</h6>
          <p class="mb-1">Mon - Fri: 9AM - 6PM</p>
          <p>Sat: 10AM - 2PM</p>

        </div>
      </div>

    </div>
  </div>
</section>

<section class="map-section">
  <iframe 
    src="https://maps.google.com/maps?q=punjab&t=&z=13&ie=UTF8&iwloc=&output=embed"
    width="100%" height="350" style="border:0;">
  </iframe>
</section>

<section class="cta-section text-center text-white">
  <div class="container">
    <h2 class="fw-bold text-light">Need expert help?</h2>
    <p>Book a free consultation with our team</p>

    <button class="btn btn-light rounded-pill px-5">
      Book a Call
    </button>
  </div>
</section>
